services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:?Run npm run env:init}
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run env:init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run env:init}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:

